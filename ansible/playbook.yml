---
- name: Configure web server
  hosts: web
  become: true
  gather_facts: false

  tasks:
    - name: Wait until the server accepts SSH
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 180

    - name: Gather facts
      ansible.builtin.setup:

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Remove nginx from the server (it now lives inside the container)
      ansible.builtin.apt:
        name:
          - nginx
          - nginx-common
        state: absent
        purge: true

    - name: Install Docker and the Python Docker library
      ansible.builtin.apt:
        name:
          - docker.io
          - python3-docker
        state: present

    - name: Make sure Docker is running and starts on boot
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Run the app container
      community.docker.docker_container:
        name: webapp
        image: "{{ app_image }}"
        pull: true
        state: started
        recreate: true
        restart_policy: always
        published_ports:
          - "80:80"

    - name: Check the site answers on port 80
      ansible.builtin.uri:
        url: http://localhost:80
        status_code: 200
      register: site
      retries: 10
      delay: 3
      until: site.status == 200

    - name: Install Node Exporter
      ansible.builtin.apt:
        name: prometheus-node-exporter
        state: present

    - name: Make sure Node Exporter is running and starts on boot
      ansible.builtin.service:
        name: prometheus-node-exporter
        state: started
        enabled: true
